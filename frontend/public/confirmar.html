<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirmação de Agendamento</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    .container {
      background: white;
      padding: 40px;
      border-radius: 10px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      max-width: 500px;
    }
    .success {
      color: green;
    }
    .error {
      color: red;
    }
    h1 {
      margin: 0;
    }
    p {
      margin: 20px 0 0 0;
    }
    a {
      display: inline-block;
      margin-top: 20px;
      padding: 10px 20px;
      background: #667eea;
      color: white;
      text-decoration: none;
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 id="title">Carregando...</h1>
    <p id="message"></p>
    <a href="/">← Voltar ao site</a>
  </div>

  <script>
    async function confirmar() {
  const params = new URLSearchParams(window.location.search);
  const token = params.get('token');
  
  const title = document.getElementById('title');
  const message = document.getElementById('message');

  if (!token) {
    title.textContent = '❌ Token Inválido';
    title.className = 'error';
    message.textContent = 'Nenhum token foi fornecido na URL';
    return;
  }

  try {
    // Criar um AbortController com timeout de 30 segundos
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 30000);

    const response = await fetch(
      `https://spa-lisianegarroni.onrender.com/api/agendamentos/confirmar/${token}`,
      { 
        method: 'POST',
        signal: controller.signal
      }
    );

    clearTimeout(timeoutId);

    const data = await response.json();

    if (data.sucesso) {
      title.textContent = '✅ Agendamento Confirmado!';
      title.className = 'success';
      message.textContent = 'Seu agendamento foi confirmado com sucesso!';
    } else {
      title.textContent = '❌ Erro na Confirmação';
      title.className = 'error';
      message.textContent = data.erro || 'Erro ao confirmar agendamento';
    }
  } catch (error) {
    if (error.name === 'AbortError') {
      title.textContent = '⏳ Demorando...';
      title.className = 'error';
      message.textContent = 'Servidor está acordando. Aguarde alguns segundos e tente novamente.';
    } else {
      title.textContent = '❌ Erro';
      title.className = 'error';
      message.textContent = 'Erro ao conectar com o servidor';
    }
  }
}

confirmar();

  </script>
</body>
</html>
